<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DispenseIQ — AI Dispensing Defect Detective</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ambient-gutters" aria-hidden="true">
  <div class="gutter-left">
    <svg viewBox="0 0 340 1000" fill="none" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <pattern id="gridLeft" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--gutter-stroke)" stroke-width="1" />
      </pattern>
      <rect width="340" height="100%" fill="url(#gridLeft)" />
      
      <!-- Dispensing Valve Schematic -->
      <g stroke="var(--gutter-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 120 150 L 220 150 L 220 350 L 170 430 L 170 470 L 150 470 L 150 480 L 190 480 L 190 470 L 170 470" />
        <path d="M 120 150 L 120 350 L 170 430" />
        <!-- Piston Head -->
        <path d="M 125 200 L 215 200 L 215 220 L 125 220 Z" fill="var(--gutter-stroke)" />
        <path d="M 170 100 L 170 200" stroke-dasharray="4 4" />
        <!-- Micro-dispense needle tip -->
        <path d="M 165 480 L 165 520 L 175 520 L 175 480" />
        <!-- Droplets -->
        <circle cx="170" cy="535" r="5" />
        <circle cx="170" cy="555" r="4" />
        <circle cx="170" cy="570" r="3" />
      </g>
      
      <!-- Annotations & Markings -->
      <g font-family="var(--font-mono)" font-size="11" fill="var(--gutter-accent)">
        <text x="30" y="215">PISTON: ACTUATED</text>
        <text x="30" y="325">VOL: 4.2 µL</text>
        <text x="30" y="505">N_DIAM: 0.25mm</text>
        
        <!-- Z Axis Arrow -->
        <path d="M 80 540 L 80 440" stroke="var(--gutter-accent)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="90" y="490">Z-AXIS</text>
      </g>
      
      <!-- Define Arrow Marker -->
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gutter-accent)" />
        </marker>
      </defs>
    </svg>
  </div>
  
  <div class="gutter-right">
    <svg viewBox="0 0 340 1000" fill="none" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <pattern id="gridRight" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--gutter-stroke)" stroke-width="1" />
      </pattern>
      <rect width="340" height="100%" fill="url(#gridRight)" />
      
      <!-- PCB Traces & Pads -->
      <g stroke="var(--gutter-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Trace 1 -->
        <path d="M 70 200 L 170 200 L 220 250 L 220 330" />
        <circle cx="70" cy="200" r="5" fill="var(--gutter-stroke)" />
        <circle cx="220" cy="330" r="4" fill="var(--gutter-stroke)" />
        
        <!-- Trace 2 -->
        <path d="M 100 230 L 150 230 L 200 280 L 200 330" />
        <circle cx="100" cy="230" r="5" fill="var(--gutter-stroke)" />
        
        <!-- Trace 3 (Busing) -->
        <path d="M 270 150 L 270 550" stroke-width="2.5" />
        <path d="M 270 370 L 220 370" />
        <path d="M 270 410 L 220 410" />
        <path d="M 270 450 L 220 450" />
        
        <!-- IC Footprint (Quad-flat pad array) -->
        <rect x="100" y="600" width="100" height="100" stroke-dasharray="5 5" />
        
        <rect x="85" y="610" width="15" height="6" />
        <rect x="85" y="628" width="15" height="6" />
        <rect x="85" y="646" width="15" height="6" />
        <rect x="85" y="664" width="15" height="6" />
        <rect x="85" y="682" width="15" height="6" />
        
        <rect x="200" y="610" width="15" height="6" />
        <rect x="200" y="628" width="15" height="6" />
        <rect x="200" y="646" width="15" height="6" />
        <rect x="200" y="664" width="15" height="6" />
        <rect x="200" y="682" width="15" height="6" />
        
        <circle cx="120" cy="620" r="4" fill="var(--gutter-accent)" />
      </g>
      
      <!-- Fiducial crosshairs -->
      <g stroke="var(--gutter-accent)" stroke-width="1.5">
        <circle cx="300" cy="120" r="12" />
        <path d="M 280 120 L 320 120" />
        <path d="M 300 100 L 300 140" />
        
        <circle cx="300" cy="800" r="12" />
        <path d="M 280 800 L 320 800" />
        <path d="M 300 780 L 300 820" />
      </g>
      
      <!-- Annotations -->
      <g font-family="var(--font-mono)" font-size="11" fill="var(--gutter-accent)">
        <text x="200" y="100">FIDUCIAL_1</text>
        <text x="200" y="780">FIDUCIAL_2</text>
        <text x="200" y="580">IC_PKG_QFP48</text>
        <text x="40" y="160">AXIS_Z_OFFSET: 0.125mm</text>
        <text x="40" y="175">SYS_STAT: MONITORING</text>
      </g>
    </svg>
  </div>
</div>
<div class="shell">
  <header class="topbar" data-noprint>
    <a href="#" class="brand" data-action="go-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-600)" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="14" height="14"></rect><path d="M12 2v6"></path><path d="M12 16v6"></path><path d="M2 12h6"></path><path d="M16 12h6"></path></svg>
      <span>Dispense<span class="brand-iq">IQ</span></span>
    </a>
    <nav class="nav-steps" id="nav-steps"></nav>
    <div class="topbar-links">
      <a href="#" class="history-link" data-action="go-history">
        <span class="dot"></span> Case history
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
      </a>
      <a href="#" class="history-link" data-action="go-settings">
        Settings
      </a>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer" data-noprint>
    <span>DispenseIQ · Preliminary AI troubleshooting for fluid dispensing</span>
    <span>Assists engineers — does not replace them</span>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
