<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DispenseIQ — AI Dispensing Defect Detective</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <header class="topbar" data-noprint>
    <a href="#" class="brand" data-action="go-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-600)" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="14" height="14"></rect><path d="M12 2v6"></path><path d="M12 16v6"></path><path d="M2 12h6"></path><path d="M16 12h6"></path></svg>
      <span>Dispense<span class="brand-iq">IQ</span></span>
    </a>
    <nav class="nav-steps" id="nav-steps"></nav>
    <div style="display: flex; gap: 8px;">
      <a href="#" class="history-link" data-action="go-history">
        <span class="dot"></span> Case history
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
      </a>
      <a href="#" class="history-link" data-action="go-settings">
        Settings
      </a>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer" data-noprint>
    <span>DispenseIQ · Preliminary AI troubleshooting for fluid dispensing</span>
    <span>Assists engineers — does not replace them</span>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
